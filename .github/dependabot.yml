version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    labels: ["area:contract", "dependencies"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      app-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["area:app", "dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: ["area:infra", "dependencies"]
