name: Feature request
description: Propose a new feature or screen
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't users or developers do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Link a design in design/stitch if one exists.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
