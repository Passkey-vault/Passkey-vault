name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with coverage
        run: |
          cargo llvm-cov --summary-only | tee coverage.txt
          { echo '### Contract coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # soroban-sdk 29+ only builds wasm through stellar-cli v25.2.0+.
      - uses: stellar/stellar-cli@v26.1.0
      - run: stellar contract build
      - name: Report wasm size
        run: |
          WASM=target/wasm32v1-none/release/passkey_vault.wasm
          SIZE=$(stat -c %s "$WASM")
          echo "### Contract wasm: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          # Soroban's network limit is 128 KiB; fail well before that.
          test "$SIZE" -lt 65536 || { echo "::error::wasm is $SIZE bytes (limit 64 KiB)"; exit 1; }

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Test with coverage
        run: |
          pnpm test:coverage | tee coverage.txt
          { echo '### App coverage (src/lib)'; echo '```'; sed -n '/Coverage summary/,/^=*$/p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm build
